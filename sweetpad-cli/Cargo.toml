[package]
name = "sweetpad-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false
description = "The `sweetpad` command-line interface over sweetpad-core."

# A pure native binary, distributed via Homebrew.
[[bin]]
name = "sweetpad"
path = "src/bin/sweetpad.rs"

[dependencies]
serde_json.workspace = true
serde.workspace = true
toml.workspace = true
tar = "0.4"
walkdir = "2"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
rpassword = "7"
getrandom = "0.4"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
crossterm = "0.29"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(not(windows))'.dependencies]
sweetpad-lib.workspace = true
sweetpad-core.workspace = true
clap.workspace = true
clap_complete.workspace = true
dialoguer.workspace = true
toml_edit.workspace = true
libc.workspace = true
minreq.workspace = true

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
sha2 = "0.10"

[lints]
workspace = true
