name: Release CLI (Nailington)

on:
  push:
    tags: ["cli-v*-nailington.*"]
  # Manual runs build downloadable artifacts without publishing or updating Homebrew.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-release-nailington
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      asset_version: ${{ steps.metadata.outputs.asset_version }}
      publish: ${{ steps.metadata.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate fork version and tag
        id: metadata
        run: python .github/scripts/release.py metadata cli
      - name: Package agent skills from this commit
        env:
          ASSET_VERSION: ${{ steps.metadata.outputs.asset_version }}
        run: python .github/scripts/release.py skills --version "$ASSET_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: agent-skills-nailington
          path: dist/*.zip
          if-no-files-found: error

  build:
    name: CLI · ${{ matrix.platform }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos-universal
          - os: ubuntu-22.04
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      ASSET_VERSION: ${{ needs.prepare.outputs.asset_version }}
      PUBLISH: ${{ needs.prepare.outputs.publish }}
    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - name: Build universal macOS CLI
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          bash sweetpad-cli/vendor/injection-client/build.sh
          cargo build --locked --release -p sweetpad-cli --target aarch64-apple-darwin
          cargo build --locked --release -p sweetpad-cli --target x86_64-apple-darwin
          mkdir -p dist/bin
          lipo -create -output dist/bin/sweetpad \
            target/aarch64-apple-darwin/release/sweetpad \
            target/x86_64-apple-darwin/release/sweetpad
          chmod +x dist/bin/sweetpad
      - name: Build Windows or Linux CLI
        if: runner.os != 'macOS'
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == Linux ]]; then
            # Bundle OpenSSL so the download does not depend on the host's libssl ABI.
            OPENSSL_STATIC=1 OPENSSL_LIB_DIR=/usr/lib/x86_64-linux-gnu OPENSSL_INCLUDE_DIR=/usr/include \
              cargo build --locked --release -p sweetpad-cli
          else
            cargo build --locked --release -p sweetpad-cli
          fi
          mkdir -p dist/bin
          if [[ "$RUNNER_OS" == Windows ]]; then
            cp target/release/sweetpad.exe dist/bin/sweetpad.exe
          else
            cp target/release/sweetpad dist/bin/sweetpad
          fi
      - name: Test SSH authentication
        run: cargo test --locked -p sweetpad-cli --test ssh_auth
      - name: Verify executable version and help
        run: |
          set -euo pipefail
          BINARY=dist/bin/sweetpad
          if [[ "$RUNNER_OS" == Windows ]]; then BINARY="$BINARY.exe"; fi
          ACTUAL="$("$BINARY" --version | tr -d '\r')"
          if [[ "$PUBLISH" == true ]]; then
            test "$ACTUAL" = "sweetpad $VERSION"
          else
            [[ "$ACTUAL" == "sweetpad $VERSION"* ]]
          fi
          "$BINARY" --help
      - name: Verify Linux TLS libraries are bundled
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          ldd dist/bin/sweetpad > "$RUNNER_TEMP/cli-libraries.txt"
          cat "$RUNNER_TEMP/cli-libraries.txt"
          if grep -E 'lib(ssl|crypto)\.' "$RUNNER_TEMP/cli-libraries.txt"; then
            echo '::error::Linux release must bundle OpenSSL'
            exit 1
          fi
      - name: Sign and notarize macOS CLI (optional)
        if: runner.os == 'macOS' && vars.MACOS_SIGNING_ENABLED == 'true'
        uses: ./.github/actions/sign-macos
        with:
          paths: dist/bin/sweetpad
          certificate: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          notary-key: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          notary-key-id: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          notary-issuer-id: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      - name: Package CLI
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          BINARY=dist/bin/sweetpad
          if [[ "$RUNNER_OS" == Windows ]]; then BINARY="$BINARY.exe"; fi
          python .github/scripts/release.py package --binary "$BINARY" --platform "$PLATFORM" --version "$ASSET_VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.platform }}-nailington
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true' && github.repository == 'Nailington/sweetpad'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*-nailington
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: agent-skills-nailington
          path: dist
      - name: Generate Homebrew formula and checksums
        run: |
          python .github/scripts/release.py formula --version "$VERSION" --repository "$GITHUB_REPOSITORY"
          python .github/scripts/release.py checksums
      - name: Write release notes
        env:
          SIGNED: ${{ vars.MACOS_SIGNING_ENABLED == 'true' }}
        run: |
          cat > dist/notes.md <<EOF
          Nailington's SweetPad fork, version $VERSION. These builds are separate from upstream SweetPad.

          **Homebrew (macOS universal or Linux x86_64):**
          \`brew install nailington/tap/sweetpad-nailington\`

          **Binaries:** extract the archive for your platform and put \`sweetpad\` / \`sweetpad.exe\` on PATH.
          Linux requires glibc 2.35 or newer. Windows and Linux use OpenSSH and a Mac with this fork's CLI and Xcode for Apple builds.
          Verify downloads against \`SHA256SUMS\`.

          **Agent skills:** extract \`sweetpad-agent-skills-$VERSION.zip\` and follow its \`INSTALL.md\`.
          The archive includes the complete \`skills/\` tree from this release's commit.

          macOS Developer ID signing and notarization enabled: **$SIGNED**.
          EOF
      - name: Publish fork binaries
        uses: softprops/action-gh-release@v3
        with:
          name: SweetPad CLI ${{ needs.prepare.outputs.version }} (Nailington)
          body_path: dist/notes.md
          generate_release_notes: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.rb
            dist/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: homebrew-formula-nailington
          path: dist/sweetpad-nailington.rb
          if-no-files-found: error

  homebrew:
    name: Update the compatibility Homebrew formula
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/download-artifact@v8
        with:
          name: homebrew-formula-nailington
          path: generated-formula
      - name: Commit released formula
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p Formula
          cp generated-formula/sweetpad-nailington.rb Formula/sweetpad-nailington.rb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/sweetpad-nailington.rb
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Homebrew: $RELEASE_TAG"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"
