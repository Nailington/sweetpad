name: Release VS Code extension (Nailington)

on:
  push:
    tags: ["v*-nailington"]
  # Manual runs only upload a VSIX artifact; they never publish to a registry.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-release-nailington
  cancel-in-progress: false

jobs:
  build:
    name: Build universal fork VSIX
    runs-on: macos-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      asset_version: ${{ steps.metadata.outputs.asset_version }}
      publish: ${{ steps.metadata.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Validate fork identity, version and tag
        id: metadata
        run: python3 .github/scripts/release.py metadata extension
      - name: Prepare release notes from the extension changelog
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          mkdir -p dist
          cat > dist/notes.md <<'EOF'
          Nailington's SweetPad fork, separate from upstream SweetPad.
          Download the VSIX and use **Extensions → … → Install from VSIX** in VS Code or Cursor.
          Extension ID: `nailington.sweetpad-nailington`. Disable upstream SweetPad when using this fork; both expose SweetPad commands.
          Windows/Linux remote mode also requires the fork CLI locally, OpenSSH, and the fork CLI + Xcode on a Mac.
          The agent-skills ZIP contains this release's complete `skills/` tree and installation instructions.

          ## Changes

          EOF
          python3 .github/scripts/release.py extension-notes --version "$VERSION" >> dist/notes.md
      - name: Install pinned Rust toolchain
        run: rustup show
      - run: npm ci
      - name: Build release bundle
        working-directory: sweetpad-vscode
        run: npm run vscode:prepublish
      - name: Check extension types and tests
        working-directory: sweetpad-vscode
        run: |
          npm run check:types
          npm test
      - name: Sign and notarize native addon (optional)
        if: vars.MACOS_SIGNING_ENABLED == 'true'
        uses: ./.github/actions/sign-macos
        with:
          paths: sweetpad-vscode/out/lib/*.node
          certificate: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          notary-key: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          notary-key-id: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          notary-issuer-id: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
      - name: Package fork VSIX
        working-directory: sweetpad-vscode
        env:
          ASSET_VERSION: ${{ steps.metadata.outputs.asset_version }}
        run: |
          set -euo pipefail
          # Reuse the signed bundle rather than rebuilding it from vsce's hook.
          npm pkg delete 'scripts.vscode:prepublish'
          mkdir -p ../dist
          npx --yes @vscode/vsce@3.6.2 package --no-dependencies \
            --baseContentUrl "https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/sweetpad-vscode" \
            --baseImagesUrl "https://github.com/$GITHUB_REPOSITORY/raw/$GITHUB_SHA/sweetpad-vscode" \
            --out "../dist/sweetpad-$ASSET_VERSION.vsix"
      - name: Package agent skills and add checksums
        env:
          ASSET_VERSION: ${{ steps.metadata.outputs.asset_version }}
        run: |
          python3 .github/scripts/release.py skills --version "$ASSET_VERSION"
          python3 .github/scripts/release.py checksums
      - uses: actions/upload-artifact@v7
        with:
          name: vsix-nailington
          path: dist/*
          if-no-files-found: error

  publish-github:
    needs: build
    if: needs.build.outputs.publish == 'true' && github.repository == 'Nailington/sweetpad'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vsix-nailington
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          name: SweetPad VS Code ${{ needs.build.outputs.asset_version }}
          body_path: dist/notes.md
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            dist/*.vsix
            dist/*.zip
            dist/SHA256SUMS

  publish-marketplace:
    needs: [build, publish-github]
    if: vars.PUBLISH_VS_MARKETPLACE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: vsix-nailington
          path: dist
      - name: Publish under the nailington publisher
        env:
          VSCE_PAT: ${{ secrets.VS_MARKETPLACE_TOKEN }}
        run: |
          test -n "$VSCE_PAT" || { echo '::error::VS_MARKETPLACE_TOKEN is required'; exit 1; }
          npx --yes @vscode/vsce@3.6.2 publish --packagePath dist/*.vsix --skip-duplicate

  publish-openvsx:
    needs: [build, publish-github]
    if: vars.PUBLISH_OPEN_VSX == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: vsix-nailington
          path: dist
      - name: Publish under the nailington namespace
        env:
          OVSX_PAT: ${{ secrets.OPEN_VSX_TOKEN }}
        run: |
          test -n "$OVSX_PAT" || { echo '::error::OPEN_VSX_TOKEN is required'; exit 1; }
          npx --yes ovsx@0.10.4 publish dist/*.vsix --skip-duplicate
